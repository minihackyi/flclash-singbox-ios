mixed-port: 7897
mode: rule
log-level: debug
ipv6: false
allow-lan: false
tcp-concurrent: true
dns:
  enable: true
  default-nameserver:
    - 223.5.5.5
  nameserver:
    - 223.5.5.5
    - https://doh.pub/dns-query
proxies:
  - name: "http-local"
    type: http
    server: 127.0.0.1
    port: 18080
  - name: "socks-local"
    type: socks5
    server: 127.0.0.1
    port: 18081
  - name: "ss-sample"
    type: ss
    server: 192.0.2.1
    port: 8388
    cipher: aes-256-gcm
    password: "test-password"
  - name: "vmess-sample"
    type: vmess
    server: 192.0.2.2
    port: 443
    uuid: "b831381d-6324-4d53-ad4f-8cda48b30811"
    alterId: 0
    cipher: auto
    tls: true
    servername: "example.com"
    network: ws
    ws-opts:
      path: /path
      headers:
        Host: example.com
  - name: "trojan-sample"
    type: trojan
    server: 192.0.2.3
    port: 443
    password: "trojan-pass"
    sni: "example.org"
    skip-cert-verify: true
proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "AUTO"
      - "http-local"
      - "socks-local"
      - "ss-sample"
      - "vmess-sample"
      - "trojan-sample"
  - name: "AUTO"
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "http-local"
      - "socks-local"
rules:
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,baidu.com,DIRECT
  - DOMAIN-SUFFIX,qq.com,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT
  - GEOIP,LAN,DIRECT
  - MATCH,PROXY

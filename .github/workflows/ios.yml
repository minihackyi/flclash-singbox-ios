name: Build iOS ipa (unsigned)

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Go proxy
        run: |
          go env -w GOPROXY=https://proxy.golang.org,direct
          go version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build sing-box core (c-archive, arm64)
        shell: bash
        run: |
          set -o pipefail
          bash tool/build_ios_core.sh 2>&1 | tee core_build.log

      - name: Publish core build log to repo
        if: failure()
        shell: bash
        run: |
          tail -c 60000 core_build.log > build-log.txt || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add build-log.txt
          git commit -m "ci: core build log [skip ci]" || true
          git push || true

      - name: Build ipa (no codesign)
        shell: bash
        run: |
          set -o pipefail
          flutter build ipa --release --no-codesign 2>&1 | tee ipa_build.log

      - name: Publish ipa build log to repo
        if: failure()
        shell: bash
        run: |
          tail -c 60000 ipa_build.log > ipa-log.txt || true
          git config user.name "ci-bot"
          git config user.email "ci-bot.noreply.github.com"
          git add ipa-log.txt
          git commit -m "ci: ipa build log [skip ci]" || true
          git push || true

      - name: Pack unsigned ipa
        run: |
          cd build/ios/archive
          mkdir -p Payload
          cp -r Runner.xcarchive/Products/Applications/Runner.app Payload/
          zip -qry FlClash-unsigned.ipa Payload
          ls -lh FlClash-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-ios-unsigned-ipa
          path: build/ios/archive/FlClash-unsigned.ipa

name: Build iOS ipa (unsigned)

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Go proxy
        run: |
          go env -w GOPROXY=https://proxy.golang.org,direct
          go version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Select newest Xcode
        run: |
          ls /Applications | grep Xcode || true
          sudo xcode-select -s $(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          xcodebuild -version

      - name: Pub get
        run: flutter pub get

      - name: Build sing-box core (c-archive, arm64)
        shell: bash
        run: |
          set -o pipefail
          bash tool/build_ios_core.sh 2>&1 | tee core_build.log

      - name: Publish core build log to repo
        if: failure()
        shell: bash
        run: |
          tail -c 100000 core_build.log > build-log.txt || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add build-log.txt
          git commit -m "ci: core build log [skip ci]" || true
          git pull --rebase origin main || true
          git push || true

      - name: Build iOS app (unsigned)
        shell: bash
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign -v 2>&1 | tee ipa_build.log

      - name: Publish ipa build log to repo
        if: failure()
        shell: bash
        run: |
          tail -c 3000000 ipa_build.log > ipa-log.txt || true
          git config user.name "ci-bot"
          git config user.email "ci-bot.noreply.github.com"
          git add ipa-log.txt
          git commit -m "ci: ipa build log [skip ci]" || true
          git push || true

      - name: Build extension explicitly (fallback)
        if: always()
        shell: bash
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme PacketTunnel -configuration Release -sdk iphoneos -derivedDataPath ../build/ios/extdd CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build || true
          cd ..
          find build -name "PacketTunnel.appex" || true

      - name: Pack unsigned ipa
        if: always()
        shell: bash
        run: |
          set -x
          ls -la build/ios/iphoneos/ 2>&1 || true
          find build -name "*.appex" -o -name "Runner.app" -maxdepth 6 2>/dev/null | head -5 || true
          mkdir -p build/payload/Payload
          cp -r build/ios/iphoneos/Runner.app build/payload/Payload/
          APPEX=$(find build -name "PacketTunnel.appex" -type d | head -1)
          if [ -n "$APPEX" ]; then
            mkdir -p build/payload/Payload/Runner.app/PlugIns
            cp -r "$APPEX" build/payload/Payload/Runner.app/PlugIns/
          else
            echo "WARNING: PacketTunnel.appex not found"
          fi
          cd build/payload
          zip -qry ../FlClash-unsigned.ipa Payload 2>&1 | tee ../pack.log
          ls -lh ../FlClash-unsigned.ipa

      - name: Publish pack log
        if: always()
        shell: bash
        run: |
          cp build/pack.log pack-log.txt 2>/dev/null || true
          git config user.name "ci-bot"
          git config user.email "ci-bot.noreply.github.com"
          git add pack-log.txt 2>/dev/null || true
          git commit -m "ci: pack log [skip ci]" 2>/dev/null || true
          git push 2>/dev/null || true

      - name: Upload everything (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-outputs
          if-no-files-found: warn
          path: |
            build/FlClash-unsigned.ipa
            build/payload/**
            build/ios/iphoneos/Runner.app/**
            build/ios/extdd/Build/Products/**
